user http;
worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid       /run/nginx.pid;

# Keep the module directory supplied by your nginx package.
include /etc/nginx/modules.d/*.conf;

events {
    worker_connections 4096;
}


http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;

    log_format main
        '$remote_addr - $host [$time_local] "$request" '
        '$status $body_bytes_sent $request_time '
        '"$http_referer" "$http_user_agent"';

    access_log off;
    ##
    # Static-file delivery
    ##

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    keepalive_timeout  30s;
    keepalive_requests 1000;

    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          30s;
    client_max_body_size  1m;

    reset_timedout_connection on;

    # Cache file descriptors and filesystem lookups.
    open_file_cache          max=10000 inactive=60s;
    open_file_cache_valid    30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    ##
    # Compression
    ##

    gzip_static on;

    # Fall back to runtime compression.
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;

    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/manifest+json
        application/rss+xml
        application/atom+xml
        application/xml
        image/svg+xml;

    ##
    # TLS
    ##

    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_session_cache   shared:TLS:10m;
    ssl_session_timeout 1h;

    # Favor lower time-to-first-byte for typical website responses.
    ssl_buffer_size 4k;

    # Used by certificates supplied through ACME variables.
    ssl_certificate_cache max=100 inactive=1m valid=5m;

    ##
    # Automatic certificates
    ##

    # The ACME module requires an explicit DNS resolver.
    resolver 1.1.1.1 1.0.0.1 valid=300s;
    resolver_timeout 5s;

    acme_issuer letsencrypt {
        uri https://acme-v02.api.letsencrypt.org/directory;
        contact mailto:<YOUR EMAIL>;
        state_path /var/cache/nginx/acme-letsencrypt;
        accept_terms_of_service;
    }

    acme_shared_zone zone=acme:1M;

    ##
    # hbox sites
    ##

    include /etc/nginx/sites-enabled/*.conf;
    include /srv/hbox/*/nginx.conf;
}