server {
    listen 80;
    listen [::]:80;

    server_name %DOMAINS%;

    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    http2 on;

    server_name %DOMAINS%;

    root /srv/hbox/%SITENAME%/;
    index index.html;

    acme_certificate letsencrypt;

    ssl_certificate     $acme_certificate;
    ssl_certificate_key $acme_certificate_key;

    %ACCESS_LOG%

    # nginx.conf is inside the document root.
    location = /nginx.conf {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}