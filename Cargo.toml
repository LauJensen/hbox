[package]
name = "hbox"
version = "0.9.0"
edition = "2024"

[dev-dependencies]
tempfile = "3"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
include_dir = "0.7"
gray_matter = "0.3"
minijinja = "2"
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
walkdir = "2"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
notify = "8"
base64 = "0.22"
mime_guess = "2"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
indicatif = "0.18.4"
futures = "0.3.32"
notify-debouncer-full = "0.7"
lightningcss = "1.0.0-alpha.71"
regex = "1"
html-escape = "0.2"
syntect = "5"
image = { version = "0.25", features = ["jpeg", "png", "webp"] }
webp = "0.3"
minify-html = "0.15"
kuchiki = "0.8"
chrono = { version = "0.4", features = ["serde"] }
schemars = "1"
sha2 = "0.10"
textwrap = { version = "0.16", default-features = false }
fastrand = "2"