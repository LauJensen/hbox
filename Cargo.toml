[package]
name         = "hbox"
version      = "0.9.0"
rust-version = "1.88"
edition      = "2024"
license      = "MIT"
readme       = "README.md"
homepage     = "https://www.gethbox.com"
repository   = "https://github.com/LauJensen/hbox"
description  = "A static site builder optimized for AI-generated source files"

[profile.release]
strip         = "symbols"
lto           = "thin"
codegen-units = 1
panic         = "abort"

[dev-dependencies]
tempfile    = "3"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
include_dir = "0.7"
gray_matter = "0.3"
minijinja = "2"
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
walkdir = "2"
tokio = {
    version = "1",
    features = [
        "fs",
        "macros",
        "net",
        "rt-multi-thread",
        "sync",
        "time",
    ]
}
axum = "0.8"
notify = "8"
base64 = "0.22"
mime_guess = "2"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
indicatif = "0.18.4"
futures = "0.3.32"
notify-debouncer-full = "0.7"
lightningcss = "1.0.0-alpha.71"
regex = "1"
html-escape = "0.2"
syntect = "5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"]}
webp = "0.3"
minify-html = "0.15"
kuchiki = "0.8"
chrono = { version = "0.4", features = ["serde"] }
schemars = "1"
sha2 = "0.10"
textwrap = { version = "0.16", default-features = false }
fastrand = "2"
rayon = "1"
clap_complete = { version = "4", features = ["unstable-dynamic"] }