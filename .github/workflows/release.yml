name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: hbox-linux-x86_64.tar.gz

          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: hbox-windows-x86_64.zip

          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            archive: hbox-macos-arm64.tar.gz

          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            archive: hbox-macos-x86_64.tar.gz

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tar \
            -C "target/${{ matrix.target }}/release" \
            -czf "${{ matrix.archive }}" \
            hbox

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "target/${{ matrix.target }}/release/hbox.exe" `
            -DestinationPath "${{ matrix.archive }}"

      - name: Store compiled binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download compiled binaries
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-assets/* \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"